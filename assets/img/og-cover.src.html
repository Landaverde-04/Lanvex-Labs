<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080B11;
    --surface-1: #0F141D;
    --surface-2: #161D29;
    --surface-3: #1E2735;
    --border: #232E3E;
    --text: #E8EEF7;
    --text-muted: #94A3B8;
    --text-dim: #64748B;
    --brand: #38BDF8;
    --brand-2: #818CF8;
    --ok: #34D399;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { width: 1200px; height: 630px; overflow: hidden; }

  body {
    background: var(--bg);
    font-family: Inter, "Segoe UI", sans-serif;
    color: var(--text);
    position: relative;
  }

  /* Halo de marca, igual que el hero del sitio */
  .glow {
    position: absolute;
    width: 900px;
    height: 900px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(56,189,248,.16) 0%, rgba(129,140,248,.07) 42%, transparent 68%);
    top: -330px;
    left: -180px;
  }

  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(35,46,62,.35) 1px, transparent 1px),
      linear-gradient(90deg, rgba(35,46,62,.35) 1px, transparent 1px);
    background-size: 56px 56px;
    mask-image: radial-gradient(ellipse 90% 70% at 30% 30%, #000 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(ellipse 90% 70% at 30% 30%, #000 20%, transparent 75%);
  }

  .wrap {
    position: relative;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 396px;
    gap: 46px;
    padding: 62px 62px 62px 68px;
    align-items: center;
  }

  /* ---------- Columna izquierda ---------- */

  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }

  .brand__mark {
    width: 52px; height: 52px;
    border-radius: 15px;
    background: linear-gradient(145deg, #38BDF8, #6aa8ff);
    color: #06121C;
    font-size: 30px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 26px rgba(56,189,248,.35);
  }

  .brand__name { font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
  .brand__name span { color: var(--text-dim); font-weight: 600; }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 7px 15px 7px 9px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(22,29,41,.7);
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }

  .tag b {
    background: var(--brand);
    color: #06121C;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .08em;
    padding: 3px 9px;
    border-radius: 999px;
  }

  h1 {
    font-size: 53px;
    line-height: 1.08;
    letter-spacing: -.028em;
    font-weight: 700;
    margin-bottom: 22px;
  }

  h1 em {
    font-style: normal;
    color: var(--brand);
    white-space: nowrap;
  }

  .lead {
    font-size: 20px;
    line-height: 1.45;
    color: var(--text-muted);
    max-width: 560px;
    margin-bottom: 34px;
  }

  .foot { display: flex; align-items: center; gap: 12px; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 17px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: rgba(15,20,29,.8);
    font-size: 15px;
    color: var(--text-muted);
  }

  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }

  .url {
    font-family: "JetBrains Mono", monospace;
    font-size: 15px;
    color: var(--brand);
  }

  /* ---------- Columna derecha: mockup del sistema ---------- */

  .window {
    border: 1px solid var(--border);
    border-radius: 18px;
    background: var(--surface-1);
    overflow: hidden;
    box-shadow: 0 30px 70px -26px rgba(0,0,0,.9);
    transform: rotate(-1.4deg);
  }

  .window__bar {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 12px 15px;
    background: #0B1017;
    border-bottom: 1px solid var(--border);
  }

  .dot3 { width: 9px; height: 9px; border-radius: 50%; background: #2A374C; }

  .window__url {
    margin-left: 10px;
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    color: var(--text-dim);
  }

  .window__body { display: grid; grid-template-columns: 86px 1fr; height: 300px; }

  .mini-side { background: #0B1017; border-right: 1px solid var(--border); padding: 14px 10px; }

  .mini-logo { width: 22px; height: 22px; border-radius: 7px; background: #0F6E56; margin-bottom: 16px; }

  .mini-item { height: 12px; border-radius: 4px; background: var(--surface-2); margin-bottom: 9px; }
  .mini-item.is-on { background: rgba(15,110,86,.55); }

  .mini-main { padding: 15px 16px; }

  .mini-title { height: 11px; width: 108px; border-radius: 5px; background: #2A374C; margin-bottom: 14px; }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 9px;
    background: var(--surface-2);
    margin-bottom: 9px;
  }

  .row__av { width: 22px; height: 22px; border-radius: 50%; background: rgba(52,211,153,.35); flex-shrink: 0; }
  .row__av.b { background: rgba(251,191,36,.35); }
  .row__av.c { background: rgba(56,189,248,.3); }

  .row__lines { flex: 1; }
  .row__l1 { height: 6px; border-radius: 3px; background: #33415A; margin-bottom: 6px; }
  .row__l2 { height: 5px; width: 58%; border-radius: 3px; background: #26334A; }

  .row__pill { width: 34px; height: 11px; border-radius: 6px; background: rgba(52,211,153,.32); flex-shrink: 0; }
  .row__pill.warn { background: rgba(251,191,36,.32); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>

  <div class="wrap">
    <div>
      <div class="brand">
        <span class="brand__mark">L</span>
        <span class="brand__name">Lanvex<span>.dev</span></span>
      </div>

      <div class="tag"><b>LANVEX</b> Galería de demos</div>

      <h1>Sistemas que la gente <em>sí usa</em> todos los días.</h1>

      <p class="lead">
        Los sistemas que he desarrollado, abiertos para recorrerlos.
        Cada proyecto tiene su demo navegable, sin registro.
      </p>

      <div class="foot">
        <span class="pill"><span class="dot"></span> Demos navegables</span>
        <span class="url">landaverde-04.github.io/Lanvex-Labs</span>
      </div>
    </div>

    <div class="window">
      <div class="window__bar">
        <span class="dot3"></span><span class="dot3"></span><span class="dot3"></span>
        <span class="window__url">lanvex.dev / sistema-clinica</span>
      </div>
      <div class="window__body">
        <div class="mini-side">
          <div class="mini-logo"></div>
          <div class="mini-item is-on"></div>
          <div class="mini-item"></div>
          <div class="mini-item"></div>
          <div class="mini-item"></div>
        </div>
        <div class="mini-main">
          <div class="mini-title"></div>
          <div class="row">
            <span class="row__av"></span>
            <span class="row__lines"><span class="row__l1" style="display:block;width:74%"></span><span class="row__l2" style="display:block"></span></span>
            <span class="row__pill"></span>
          </div>
          <div class="row">
            <span class="row__av b"></span>
            <span class="row__lines"><span class="row__l1" style="display:block;width:62%"></span><span class="row__l2" style="display:block"></span></span>
            <span class="row__pill warn"></span>
          </div>
          <div class="row">
            <span class="row__av c"></span>
            <span class="row__lines"><span class="row__l1" style="display:block;width:80%"></span><span class="row__l2" style="display:block"></span></span>
            <span class="row__pill"></span>
          </div>
          <div class="row">
            <span class="row__av"></span>
            <span class="row__lines"><span class="row__l1" style="display:block;width:56%"></span><span class="row__l2" style="display:block"></span></span>
            <span class="row__pill"></span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
