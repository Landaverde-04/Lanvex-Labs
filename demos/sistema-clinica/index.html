<meta name="author" content="Kevin Landaverde">
<!-- Vista previa al compartir el enlace directo de la demo -->
<meta property="og:title" content="Sistema de Gestión Clínica — Demo de Lanvex">
<meta property="og:description" content="Demo navegable del sistema desarrollado para Clínica ProSalud: preconsulta, cola de consulta por médico, atención y receta. Cambia de rol para ver los permisos en acción.">

<meta property="og:image" content="https://landaverde-04.github.io/Lanvex-Labs/assets/img/og-cover-clinica.png">

<meta property="og:image:alt" content="Demo del sistema de gestión clínica: del papel al sistema, sin perder el paso.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sistema de Gestión Clínica — Demo de Lanvex">
<meta name="twitter:description" content="Preconsulta, cola de consulta, atención y receta. Recorre el ciclo completo cambiando de rol.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>

<!-- ============ Aviso de demo ============ -->
<div class="demo-banner no-print">
  <span class="demo-banner__text">
    <b>Demo interactiva</b> · Pacientes y personal ficticios. Cambia de rol arriba a la derecha para ver el sistema con otros permisos.
  </span>
  <a class="demo-banner__cta" href="../../index.html#contacto">
    Quiero uno así
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
</div>

<div class="app">

  <!-- ============ Sidebar ============ -->
  <aside class="sidebar" id="sidebar">
    <!-- El logo cambia con la clínica activa, como en el sistema real -->
    <div class="sidebar__brand" id="marca"></div>

    <!-- Selector de clínica activa: solo lo ve quien pertenece a más de una -->
    <div class="clinicas" id="selectorClinica" hidden>
      <div class="clinicas__label">Clínica</div>
      <div class="clinicas__group" id="clinicasGroup" role="group" aria-label="Clínica en la que trabajas"></div>
    </div>

    <nav class="sidebar__nav" id="sidebarNav"></nav>

    <div class="sidebar__foot">
      <div class="sidebar__user" id="sidebarUser"></div>
      Sistema desarrollado por<br>
      <a href="../../index.html">Lanvex — ver catálogo</a>
    </div>
  </aside>

  <div class="scrim hide no-print" id="scrim"></div>

  <!-- ============ Área principal ============ -->
  <div>
    <header class="topbar no-print">
      <button class="menu-btn" id="menuBtn" aria-label="Abrir módulos">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <div class="topbar__spacer"></div>

      <div class="rolepicker">
        <span class="rolepicker__label">Estás viendo como</span>
        <div class="rolepicker__group" id="rolePicker" role="group" aria-label="Rol con el que se navega la demo"></div>
      </div>

      <div class="topbar__user">
        <span class="avatar avatar--sm" id="userAvatar">KM</span>
        <span class="stack">
          <span class="topbar__name" id="userName">Enf. Karla Méndez</span>
          <span class="topbar__role" id="userRole">Enfermera</span>
        </span>
      </div>
    </header>

    <main class="content" id="vista"></main>
  </div>
</div>

<!-- ============ Modales y avisos ============ -->
<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitulo"></div>
</div>

<div class="toasts no-print" id="toasts" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
